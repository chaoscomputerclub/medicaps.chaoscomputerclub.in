name: GSD Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Production
    if: github.repository == 'chaoscomputerclub/medicaps.chaoscomputerclub.in'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Student Portal Frontend
        env:
          VITE_CLOUDFLARE_TURNSTILE_SITE_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SITE_KEY || secrets.VITE_CLOUDFLARE_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: 🔑 Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || '143.198.38.205' }}
        run: |
          mkdir -p "$HOME/.ssh"
          echo "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          cat >> "$HOME/.ssh/config" <<EOF
          Host production
            HostName $SSH_HOST
            User root
            IdentityFile $HOME/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: 🚀 Sync Remote Repo & Deploy Backend
        run: |
          echo "→ Pulling latest main on server..."
          ssh production 'bash -s' << 'EOF'
            set -e
            cd /root/projects/medicaps.chaoscomputerclub.in
            git fetch origin main
            git reset --hard origin/main

            echo '→ Updating backend application files...'
            rsync -av --delete \
              --exclude '.env' \
              --exclude 'keys' \
              --exclude 'venv' \
              --exclude '__pycache__' \
              --exclude '.pytest_cache' \
              --exclude '*.db*' \
              --exclude 'ccc_medicaps.db' \
              /root/projects/medicaps.chaoscomputerclub.in/backend/ /root/projects/ccc-medicaps-api/

            echo '→ Applying database schema migrations...'
            cd /root/projects/ccc-medicaps-api
            PYTHONPATH=. /root/projects/ccc-medicaps-api/venv/bin/python3 -c "import asyncio; from app.core.db import init_db; asyncio.run(init_db())" || echo "Migration check executed."

            echo '→ Syncing environment version...'
            NEW_VER=$(grep '^VERSION=' /root/projects/medicaps.chaoscomputerclub.in/backend/.env.example | cut -d= -f2)
            if [ -n "$NEW_VER" ] && [ -f /root/projects/ccc-medicaps-api/.env ]; then
              sed -i "s/^VERSION=.*/VERSION=$NEW_VER/" /root/projects/ccc-medicaps-api/.env
            fi

            echo '→ Restarting backend service...'
            systemctl restart ccc-medicaps-api.service

            echo '→ Deploying & reloading CCC Node-Agent...'
            cd /root/projects/medicaps.chaoscomputerclub.in/node-agent
            bash deploy.sh || echo 'Node-agent deployment check completed.'
          EOF

      - name: 🌐 Deploy Pre-Built Frontends & Reload Nginx
        run: |
          echo "→ Deploying verified Student Portal (preserving existing assets for active sessions)..."
          # Sync immutable hashed assets without --delete so active tabs do not encounter 404 ChunkLoadErrors
          rsync -avz dist/assets/ production:/var/www/ccc-medicaps/.output/public/assets/
          # Sync root files (index.html, favicon, robots)
          rsync -avz --exclude 'assets/' dist/ production:/var/www/ccc-medicaps/.output/public/

          echo "→ Restarting/Reloading Nginx web server..."
          ssh production "systemctl restart nginx || systemctl start nginx"

      - name: 🩺 Live Health Validation
        run: |
          sleep 3
          echo "→ Checking Backend Health..."
          API_STATUS=$(ssh production "curl -s http://127.0.0.1:8002/api/health" || echo "FAILED")
          echo "Backend Health: $API_STATUS"

          echo "→ Checking Public Web Interface..."
          WEB_CODE=$(curl -s -k -o /dev/null -w "%{http_code}" --max-time 15 https://medicaps.chaoscomputerclub.in/ || echo "FAILED")
          echo "Frontend HTTP Status: $WEB_CODE"

          if [[ "$API_STATUS" != *"operational"* ]]; then
            echo "❌ Backend health check did not report operational status!"
            exit 1
          fi

          if [[ "$WEB_CODE" != "200" ]]; then
            echo "❌ Frontend HTTP status is $WEB_CODE (expected 200)!"
            exit 1
          fi

          echo "✅ GSD Production CI/CD Deployment Verified Live & Operational!"
