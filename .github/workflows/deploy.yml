name: GSD Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Student Portal Frontend
        run: npm run build

      - name: 🔑 Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || '143.198.38.205' }}
        run: |
          mkdir -p "$HOME/.ssh"
          echo "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          cat >> "$HOME/.ssh/config" <<EOF
          Host production
            HostName $SSH_HOST
            User root
            IdentityFile $HOME/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: 🚀 Sync Remote Repo & Deploy Backend
        run: |
          echo "→ Pulling latest main on server..."
          ssh production "
            set -e
            cd /root/projects/medicaps.chaoscomputerclub.in
            git pull origin main

            echo '→ Updating backend application files...'
            rsync -av --delete \
              --exclude '.env' \
              --exclude 'keys' \
              --exclude 'venv' \
              --exclude '__pycache__' \
              --exclude '.pytest_cache' \
              --exclude '*.db*' \
              --exclude 'ccc_medicaps.db' \
              /root/projects/medicaps.chaoscomputerclub.in/backend/ /root/projects/ccc-medicaps-api/

            echo '→ Syncing contest schedules...'
            cd /root/projects/ccc-medicaps-api
            venv/bin/python scripts/launch_official_contests.py || true

            echo '→ Restarting backend service...'
            systemctl restart ccc-medicaps-api.service
          "

      - name: 🌐 Deploy Pre-Built Frontends & Reload Nginx
        run: |
          echo "→ Deploying verified Student Portal (with stale-file cleanup)..."
          # --delete removes files on server that are no longer in the current build.
          # This prevents stale JS/CSS chunks from accumulating (previously caused 155MB / 2418 files).
          rsync -avz --delete dist/ production:/var/www/ccc-medicaps/.output/public/

          echo "→ Reloading Nginx web server..."
          ssh production "systemctl reload nginx"

      - name: 🩺 Live Health Validation
        run: |
          sleep 3
          echo "→ Checking Backend Health..."
          API_STATUS=$(ssh production "curl -s http://127.0.0.1:8002/api/health" || echo "FAILED")
          echo "Backend Health: $API_STATUS"

          echo "→ Checking Public Web Interface..."
          WEB_CODE=$(curl -s -k -o /dev/null -w "%{http_code}" --max-time 15 https://medicaps.chaoscomputerclub.in/ || echo "FAILED")
          echo "Frontend HTTP Status: $WEB_CODE"

          if [[ "$API_STATUS" != *"operational"* ]]; then
            echo "❌ Backend health check did not report operational status!"
            exit 1
          fi

          if [[ "$WEB_CODE" != "200" ]]; then
            echo "❌ Frontend HTTP status is $WEB_CODE (expected 200)!"
            exit 1
          fi

          echo "✅ GSD Production CI/CD Deployment Verified Live & Operational!"
