name: Pull Request Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── JOB 1: FRONTEND STATIC ANALYSIS & COMPILATION ────────────────────────────
  frontend-gate:
    name: 🎨 Frontend Compilation & UI Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Static Type Checking
        id: ts-check
        run: npx tsc --noEmit

      - name: 🏗️ Compile Student Portal Web Bundle
        id: vite-build
        run: npm run build

      - name: 🔘 Audit Interactive UI Elements & Buttons
        id: ui-audit
        run: node scripts/audit_ui_elements_backend_connectivity.mjs

      - name: 📋 Post Frontend Gate Summary
        if: always()
        run: |
          echo "### 🎨 Frontend Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript Static Analysis (\`tsc --noEmit\`) | ${{ steps.ts-check.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Student Portal Production Bundle (\`vite build\`) | ${{ steps.vite-build.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Interactive Buttons & Backend Connectivity Audit | ${{ steps.ui-audit.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY

  # ─── JOB 2: PLAYWRIGHT E2E & ACCESSIBILITY TESTS ─────────────────────────────
  playwright-e2e-gate:
    name: 🎭 Playwright E2E & WCAG Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🌐 Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: 🧪 Execute Playwright E2E & Accessibility Suite
        id: playwright-test
        run: npx playwright test

      - name: 📤 Upload Playwright Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: 📋 Post Playwright Gate Summary
        if: always()
        run: |
          echo "### 🎭 Playwright E2E & WCAG Accessibility Gate" >> $GITHUB_STEP_SUMMARY
          echo "| Test Spec | Scope | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| Playwright E2E & WCAG Suite | Full interactive browser test suite | ${{ steps.playwright-test.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY

  # ─── JOB 3: BACKEND API QA & CONTRACT VERIFICATION ───────────────────────────
  backend-qa-gate:
    name: 🛡️ Backend API Contract & Service Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ccc_medicaps
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install Backend Python Dependencies
        run: pip install -r backend/requirements.txt

      - name: 🔑 Generate Ephemeral Asymmetric RSA 256 Keys
        run: |
          mkdir -p backend/keys
          openssl genrsa -out backend/keys/jwt_private_key.pem 2048
          openssl rsa -in backend/keys/jwt_private_key.pem -pubout -out backend/keys/jwt_public_key.pem
          chmod 600 backend/keys/jwt_private_key.pem

      - name: 🔍 Python Code Compilation Check
        id: py-compile
        run: python3 -m compileall backend/app backend/main.py

      - name: 🗄️ Initialize PostgreSQL Schema & Tables
        id: init-db
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ccc_medicaps
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_secret_key_testing_1234567890
          ALGORITHM: RS256
          FEATURE_ASSESSMENT_AND_QR_ENABLED: "false"
        run: |
          python3 -c "import asyncio; from app.core.db import init_db; asyncio.run(init_db())"

      - name: 🚀 Execute Real-Time Cache Synchronization Suite (27 Tests)
        id: test-cache-sync
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ccc_medicaps
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_secret_key_testing_1234567890
          ALGORITHM: RS256
          FEATURE_ASSESSMENT_AND_QR_ENABLED: "false"
        run: pytest backend/tests/test_cache_sync_engine.py backend/tests/test_cache_sync_deep_dive.py -v

      - name: ⚡ Execute ChaosQueue Async Architecture & DLQ Tests (10 Tests)
        id: test-queue
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ccc_medicaps
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_secret_key_testing_1234567890
          ALGORITHM: RS256
          FEATURE_ASSESSMENT_AND_QR_ENABLED: "false"
        run: pytest backend/tests/test_async_queue_architecture.py -v

      - name: 🔒 Execute Cookie Auth & Cloudflare Security Tests (12 Tests)
        id: test-cookie-auth
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ccc_medicaps
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_secret_key_testing_1234567890
          ALGORITHM: RS256
          FEATURE_ASSESSMENT_AND_QR_ENABLED: "false"
        run: pytest backend/tests/test_cookie_auth.py backend/tests/test_cloudflare_security.py -v

      - name: 🔄 Execute Contest Registration State Consistency Suite (5 Tests)
        id: test-contest-consistency
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ccc_medicaps
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_secret_key_testing_1234567890
          ALGORITHM: RS256
          FEATURE_ASSESSMENT_AND_QR_ENABLED: "false"
        run: pytest backend/tests/test_contest_registration_consistency.py -v

      - name: 🛡️ Execute Historical Invariant Regression Suite (Mandatory CI Gate)
        id: test-regression
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ccc_medicaps
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_secret_key_testing_1234567890
          ALGORITHM: RS256
          FEATURE_ASSESSMENT_AND_QR_ENABLED: "false"
        run: pytest tests/regression -v

      - name: 📋 Post Backend Gate Summary
        if: always()
        run: |
          echo "### 🛡️ Backend Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Scope | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| Python AST & Bytecode Compilation | Clean syntax & byte-compile backend/ | ${{ steps.py-compile.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Real-Time Cache Synchronization Engine | 27 Monotonic CAS, Invalidation, SWR & Concurrency Tests | ${{ steps.test-cache-sync.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ChaosQueue Async Engine & DLQ | 10 Job Lifecycle, Outbox Relay & Locking Tests | ${{ steps.test-queue.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cookie Auth & Cloudflare Security | 12 HttpOnly Rotation & Turnstile Protection Tests | ${{ steps.test-cookie-auth.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Contest Registration State Consistency | 5 Dual-Write, Invalidation & Outbox Tests | ${{ steps.test-contest-consistency.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Historical Invariant Regression Suite | 40+ Executable Invariant Tests | ${{ steps.test-regression.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
