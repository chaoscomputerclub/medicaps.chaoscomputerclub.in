[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ccc-medicaps-load-tests"
version = "1.0.0"
description = "Production-grade Locust synthetic student user testing suite for Medi-Caps Competitive Programming Platform"
authors = [{ name = "Chaos Computer Club Medi-Caps Chapter" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "locust>=2.31.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "sseclient-py>=1.8.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "tabulate>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/load"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
