# ==============================================================================
# Chaos Computer Club India — Production Nginx Configuration
# Services:
#   1. chaoscomputerclub.in (and www, ccc.sharexpress.in) -> 127.0.0.1:3002 (CCC Root SSR)
#   2. medicaps.chaoscomputerclub.in (and ccc-medicaps.sharexpress.in) -> Static SPA (/var/www/ccc-medicaps/.output/public)
#   3. admin.chaoscomputerclub.in (and admin.medicaps.chaoscomputerclub.in) -> Static SPA (/var/www/ccc-medicaps-admin)
#   4. medicaps-api.chaoscomputerclub.in, api.medicaps.chaoscomputerclub.in, api.chaoscomputerclub.in -> 127.0.0.1:8002 (CCC Medi-Caps FastAPI)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CCC Root (chaoscomputerclub.in)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name chaoscomputerclub.in www.chaoscomputerclub.in ccc.sharexpress.in;
    ssl_certificate /etc/letsencrypt/live/chaoscomputerclub.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chaoscomputerclub.in/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/ccc-root/.output/public;

    # Static assets direct serving with long cache
    location /assets/ {
        alias /var/www/ccc-root/.output/public/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # MinIO Object Storage Media Proxy
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:9002/ccc-medicaps-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 2. CCC Medi-Caps Portal (medicaps.chaoscomputerclub.in)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name medicaps.chaoscomputerclub.in ccc-medicaps.sharexpress.in ccc-medicaps.shaxpress.in;
    ssl_certificate /etc/letsencrypt/live/chaoscomputerclub.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chaoscomputerclub.in/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/ccc-medicaps/.output/public;
    index index.html;
    client_max_body_size 50M;

    # Gzip compression — tuned for JS/CSS/fonts
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        font/woff;

    # Serve pre-compressed .gz files if they exist (pair with vite build: { reportCompressedSize: true })
    gzip_static on;

    # -------------------------------------------------------------------
    # Content-hashed assets: JS, CSS, woff2 — immutable, 1 year cache
    # Vite fingerprints every file: index-CEMnatQc.js, inter-latin-Dx4k.woff2 etc.
    # Once served, never re-downloaded until hash changes on next deploy.
    # -------------------------------------------------------------------
    location /assets/ {
        alias /var/www/ccc-medicaps/.output/public/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Monaco editor workers — content-hashed by plugin, immutable cache
    location /monacoeditorwork/ {
        alias /var/www/ccc-medicaps/.output/public/monacoeditorwork/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Self-hosted fonts — long cache, CORS header required for font loading
    location /fonts/ {
        alias /var/www/ccc-medicaps/.output/public/fonts/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Static image assets (logo, favicon, robots)
    location ~* \.(webp|png|ico|svg|jpg|jpeg|gif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # MinIO Object Storage Media Proxy
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:9002/ccc-medicaps-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
    }

    # API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    # SPA entry point — never cache index.html so new deploys are picked up immediately
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}


# ------------------------------------------------------------------------------
# 3. Dedicated Admin & Proctor Command Console (admin.chaoscomputerclub.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl;
    server_name admin.chaoscomputerclub.in admin.medicaps.chaoscomputerclub.in admin-medicaps.sharexpress.in ccc-admin.sharexpress.in;

    ssl_certificate /etc/letsencrypt/live/chaoscomputerclub.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chaoscomputerclub.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/ccc-medicaps-admin;
    index index.html;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static assets direct serving
    location /assets/ {
        alias /var/www/ccc-medicaps-admin/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy to backend FastAPI service
    location /api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    # Direct SPA Serving
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------------------------
# 4. CCC Medi-Caps Backend API (medicaps-api.chaoscomputerclub.in)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name medicaps-api.chaoscomputerclub.in api.medicaps.chaoscomputerclub.in api.chaoscomputerclub.in ccc-medicaps-api.sharexpress.in;
    ssl_certificate /etc/letsencrypt/live/chaoscomputerclub.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chaoscomputerclub.in/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # MinIO Object Storage Media Proxy
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:9002/ccc-medicaps-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}

server {
    if ($host = www.chaoscomputerclub.in) {
        return 301 https://$host$request_uri;
    }

    if ($host = chaoscomputerclub.in) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name chaoscomputerclub.in www.chaoscomputerclub.in ccc.sharexpress.in;
    return 404;
}

server {
    if ($host = medicaps.chaoscomputerclub.in) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name medicaps.chaoscomputerclub.in ccc-medicaps.sharexpress.in ccc-medicaps.shaxpress.in;
    return 404;
}

server {
    if ($host = medicaps-api.chaoscomputerclub.in) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name medicaps-api.chaoscomputerclub.in api.medicaps.chaoscomputerclub.in api.chaoscomputerclub.in ccc-medicaps-api.sharexpress.in;
    return 404;
}
