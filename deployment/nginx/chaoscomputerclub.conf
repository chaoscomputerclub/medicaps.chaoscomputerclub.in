# ==============================================================================
# Chaos Computer Club India — Production Nginx Configuration
# Services:
#   1. chaoscomputerclub.in (and www, ccc.sharexpress.in) -> 127.0.0.1:3002 (CCC Root SSR)
#   2. medicaps.chaoscomputerclub.in (and ccc-medicaps.sharexpress.in) -> Static SPA (/var/www/ccc-medicaps/.output/public)
#   3. admin.chaoscomputerclub.in (and admin.medicaps.chaoscomputerclub.in) -> Static SPA (/var/www/ccc-medicaps-admin)
#   4. medicaps-api.chaoscomputerclub.in, api.medicaps.chaoscomputerclub.in, api.chaoscomputerclub.in -> 127.0.0.1:8002 (CCC Medi-Caps FastAPI)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CCC Root (chaoscomputerclub.in)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name chaoscomputerclub.in www.chaoscomputerclub.in ccc.sharexpress.in;
    ssl_certificate /etc/letsencrypt/live/chaoscomputerclub.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chaoscomputerclub.in/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/ccc-root/.output/public;

    # Static assets direct serving with long cache
    location /assets/ {
        alias /var/www/ccc-root/.output/public/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # MinIO Object Storage Media Proxy
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:9002/ccc-medicaps-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 2. CCC Medi-Caps Portal (medicaps.chaoscomputerclub.in)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name medicaps.chaoscomputerclub.in ccc-medicaps.sharexpress.in ccc-medicaps.shaxpress.in;
    ssl_certificate /etc/letsencrypt/live/chaoscomputerclub.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chaoscomputerclub.in/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/ccc-medicaps/.output/public;
    index index.html;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static assets direct serving
    location /assets/ {
        alias /var/www/ccc-medicaps/.output/public/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # MinIO Object Storage Media Proxy
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:9002/ccc-medicaps-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
    }

    # API Proxy for zero-rebuild flexibility on ANY domain
    location /api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    # Direct SPA Serving
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------------------------
# 3. Dedicated Admin & Proctor Command Console (admin.chaoscomputerclub.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl;
    server_name admin.chaoscomputerclub.in admin.medicaps.chaoscomputerclub.in admin-medicaps.sharexpress.in ccc-admin.sharexpress.in;

    ssl_certificate /etc/letsencrypt/live/chaoscomputerclub.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chaoscomputerclub.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/ccc-medicaps-admin;
    index index.html;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static assets direct serving
    location /assets/ {
        alias /var/www/ccc-medicaps-admin/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy to backend FastAPI service
    location /api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    # Direct SPA Serving
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------------------------
# 4. CCC Medi-Caps Backend API (medicaps-api.chaoscomputerclub.in)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name medicaps-api.chaoscomputerclub.in api.medicaps.chaoscomputerclub.in api.chaoscomputerclub.in ccc-medicaps-api.sharexpress.in;
    ssl_certificate /etc/letsencrypt/live/chaoscomputerclub.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chaoscomputerclub.in/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # MinIO Object Storage Media Proxy
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:9002/ccc-medicaps-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}

server {
    if ($host = www.chaoscomputerclub.in) {
        return 301 https://$host$request_uri;
    }

    if ($host = chaoscomputerclub.in) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name chaoscomputerclub.in www.chaoscomputerclub.in ccc.sharexpress.in;
    return 404;
}

server {
    if ($host = medicaps.chaoscomputerclub.in) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name medicaps.chaoscomputerclub.in ccc-medicaps.sharexpress.in ccc-medicaps.shaxpress.in;
    return 404;
}

server {
    if ($host = medicaps-api.chaoscomputerclub.in) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name medicaps-api.chaoscomputerclub.in api.medicaps.chaoscomputerclub.in api.chaoscomputerclub.in ccc-medicaps-api.sharexpress.in;
    return 404;
}
