# CCC Medi-Caps — NGINX Configuration
# Deploy to: /etc/nginx/sites-available/ccc-api
# Enable:    sudo ln -s /etc/nginx/sites-available/ccc-api /etc/nginx/sites-enabled/
# Test:      sudo nginx -t
# Reload:    sudo systemctl reload nginx

upstream fastapi {
    server 127.0.0.1:8002;
    keepalive 64;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name medicaps-api.chaoscomputerclub.in;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name medicaps-api.chaoscomputerclub.in;

    # TLS
    ssl_certificate     /etc/letsencrypt/live/medicaps-api.chaoscomputerclub.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medicaps-api.chaoscomputerclub.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Client limits
    client_max_body_size 10m;
    client_body_timeout  30s;
    client_header_timeout 10s;

    # ── SSE endpoints — buffering MUST be off ─────────────────────────────────
    # These connections are long-lived (up to 1h) and stream events line-by-line.
    # proxy_buffering on would cause Nginx to buffer chunks and defeat streaming.
    location /api/events/ {
        proxy_pass         http://fastapi;
        proxy_http_version 1.1;

        # Critical SSE settings
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";   # Keep-alive without Upgrade
        chunked_transfer_encoding on;

        # Long timeouts for persistent SSE connections
        proxy_read_timeout  3600s;   # 1 hour: longer than SSE heartbeat interval
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS for SSE (browser EventSource always sends simple CORS)
        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Cache-Control no-cache always;

        # Rate-limit SSE connections (max 10 connections per IP)
        limit_conn sse_conn_zone 10;
    }

    # ── Regular API endpoints ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://fastapi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Standard buffering is fine for JSON API responses
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      8 16k;

        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gzip compression for JSON responses
        gzip on;
        gzip_types application/json text/plain;
        gzip_min_length 1024;
    }

    # ── Health probe (no logging noise) ──────────────────────────────────────
    location /api/health {
        proxy_pass         http://fastapi;
        proxy_http_version 1.1;
        access_log off;
    }

    # ── Worker registry endpoints (higher timeout for heartbeat) ─────────────
    location /api/workers/ {
        proxy_pass         http://fastapi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── OpenAPI docs ──────────────────────────────────────────────────────────
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://fastapi;
        proxy_http_version 1.1;
    }
}

# ── Rate limiting zones (define in nginx.conf http {} block) ─────────────────
# Add these to /etc/nginx/nginx.conf inside the http {} block:
#
#   limit_req_zone  $binary_remote_addr zone=api_ratelimit:10m rate=100r/s;
#   limit_conn_zone $binary_remote_addr zone=sse_conn_zone:10m;
#   limit_conn_zone $binary_remote_addr zone=api_conn_zone:10m;
