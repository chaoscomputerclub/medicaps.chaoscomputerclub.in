# ==============================================================================
# Cloudflare Edge Ingress & Routing Configuration
# Chaos Computer Club — Medi-Caps Chapter
#
# NOTE: The legacy private stack tunnel to localhost:443 has been completely
# decommissioned. Production traffic is routed directly at the Cloudflare Edge:
#
# 1. Main Student Portal:
#    DNS: CNAME medicaps.chaoscomputerclub.in -> cname.vercel-dns.com
#    Platform: Vercel Global Edge Network (React 19 / Vite SPA)
#
# 2. Production API & Control Plane:
#    DNS: CNAME medicaps-api.chaoscomputerclub.in -> ghs.googlehosted.com
#    Platform: Google Cloud Run (ccc-api service container)
#
# 3. Realtime Streaming & SSE:
#    Route: /api/events/* via Cloudflare Worker (infra/cloudflare/worker.js)
#    Platform: Google Cloud Run (ccc-realtime service container)
# ==============================================================================

# Optional Cloudflare Zero Trust tunnel for private administrative database inspection
# (Never handles public web ingress)
tunnel: medicaps-cloud-admin-connector
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # Internal admin telemetry & diagnostics probe (Private Zero Trust only)
  - hostname: admin-internal.medicaps.chaoscomputerclub.in
    service: http://127.0.0.1:8000
    originRequest:
      noTLSVerify: true
      connectTimeout: 5s

  # Fallback
  - service: http_status:404
