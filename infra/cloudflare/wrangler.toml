name = "medicaps-edge-router"
main = "worker.js"
compatibility_date = "2024-09-23"
account_id = "7c50b8a6361434c53562a5b01d35a714"
workers_dev = true

# =============================================================================
# Architecture:
#   chaoscomputerclub.in             → Vercel (frontend root)  — NOT routed here
#   medicaps.chaoscomputerclub.in    → Vercel (portal frontend) — /api/* routed here
#   api-medicaps.chaoscomputerclub.in → THIS WORKER (edge API ingress)
#                                       custom_domain auto-creates DNS record
# =============================================================================

routes = [
  # API-dedicated subdomain (custom_domain auto-provisions the DNS CNAME record)
  { pattern = "api-medicaps.chaoscomputerclub.in", custom_domain = true },
  # Portal /api/* — catches frontend same-origin API calls
  { pattern = "medicaps.chaoscomputerclub.in/api/*", zone_name = "chaoscomputerclub.in" }
]

[vars]
FRONTEND_ORIGIN = "https://medicaps.chaoscomputerclub.in"
ROUTER_PEERS = "https://ccc-medicaps-peer.onrender.com"
