# ==============================================================================
# Global Fabric Edge Reverse Proxy & Load Balancer
# Medi-Caps Chapter — Chaos Computer Club
# ==============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format fabric '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time" '
                      'fabric_node="$upstream_addr"';

    access_log /var/log/nginx/fabric_access.log fabric buffer=32k flush=5s;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/rss+xml application/atom+xml image/svg+xml;

    # Upstream Cloud Control Plane & Global Fabric Router (HTTP REST)
    upstream cloud_control_plane {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Upstream Fabric gRPC Control Plane (HTTP/2)
    upstream grpc_control_plane {
        server 127.0.0.1:50051;
        keepalive 64;
    }

    # Upstream WebSocket Multiplexing Tunnels from Local Nodes
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Cache Zone for Immutable Frontend Static Assets
    proxy_cache_path /var/cache/nginx/fabric_static levels=1:2 keys_zone=fabric_static_cache:10m max_size=500m inactive=7d use_temp_path=off;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=judge_submits:10m rate=5r/s;

    server {
        listen 80;
        listen [::]:80;
        server_name medicaps.chaoscomputerclub.in medicaps-api.chaoscomputerclub.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name medicaps.chaoscomputerclub.in medicaps-api.chaoscomputerclub.in;

        ssl_certificate /etc/letsencrypt/live/medicaps.chaoscomputerclub.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/medicaps.chaoscomputerclub.in/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Root static frontend build (fallback if not routed to remote nodes)
        root /var/www/medicaps/dist;
        index index.html;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:; worker-src 'self' blob:;" always;

        # 1. Global Fabric gRPC Endpoint (HTTP/2 + TLS for high-throughput node agent communication)
        location /fabric.v1.FabricControlPlane/ {
            grpc_pass grpc://grpc_control_plane;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
        }

        # 2. Global Fabric Tunnel Endpoint (Go node agents connect outbound via WSS)
        location /api/v1/fabric/tunnel/ {
            proxy_pass http://cloud_control_plane;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 2. Server-Sent Events (SSE) Realtime Stream
        location ~* ^/api/(v1/)?(events|feed)/stream {
            proxy_pass http://cloud_control_plane;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Critical SSE Flags: Disable buffering
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 3. Code Submission & Execution APIs
        location ~* ^/api/(v1/)?(contests/.*/submit|contests/.*/run|jobs)$ {
            limit_req zone=judge_submits burst=10 nodelay;
            proxy_pass http://cloud_control_plane;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10m;
        }

        # 4. Standard Backend APIs
        location /api/ {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass http://cloud_control_plane;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 25m;
        }

        # 5. Immutable Static Frontend Assets
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # 6. Single Page Application (SPA) HTML fallback
        location / {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            try_files $uri $uri/ /index.html;
        }
    }
}
