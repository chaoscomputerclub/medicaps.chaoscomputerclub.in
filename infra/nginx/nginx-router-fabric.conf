# ==============================================================================
# CCC Peer-to-Peer Distributed Service Fabric — Stateless Router Configuration
# Disposable, Horizontally Replicable Data-Plane Ingress Router
# ==============================================================================

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/router_error.log warn;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 5000;
    server_tokens off;

    # Gzip Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Structured JSON Telemetry Log Format
    log_format p2p_telemetry escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$http_x_request_id",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time"'
    '}';

    access_log /var/log/nginx/router_access.log p2p_telemetry buffer=32k flush=5s;

    # Upstream Definitions (Dynamically populated by scripts/peer_sync_router.py)
    include /etc/nginx/conf.d/peer-upstreams.conf;

    # Fallback Default Upstreams if peer-upstreams.conf is initializing
    upstream fallback_api_peers {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Router-Node "$hostname" always;

        # Health & Telemetry Probe
        location /health {
            default_type application/json;
            return 200 '{"status":"healthy","role":"router_peer","node":"$hostname","timestamp":"$time_iso8601"}';
        }

        # 1. Realtime SSE Gateway Route (Non-buffered, long-lived streaming)
        location /api/events/ {
            proxy_pass http://realtime_peers;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Last-Event-ID $http_last_event_id;

            # Crucial for SSE: Disable all buffering
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            chunked_transfer_encoding on;
        }

        # 2. REST API Request Routing (Least-connections load balancing)
        location /api/ {
            proxy_pass http://api_peers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;

            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # 3. Internal Authenticated Peer Services
        location /internal/ {
            # Deny by default from public internet if not presenting peer token
            if ($http_x_peer_signature = "") {
                return 403 '{"error":"Forbidden: Missing peer authentication signature"}';
            }
            proxy_pass http://api_peers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Peer-Id $http_x_peer_id;
            proxy_set_header X-Peer-Signature $http_x_peer_signature;
            proxy_set_header X-Peer-Timestamp $http_x_peer_timestamp;
        }

        # Block any unexpected public roots
        location / {
            return 404 '{"error":"Route not managed by data-plane router. Point to frontend origin."}';
        }
    }
}
