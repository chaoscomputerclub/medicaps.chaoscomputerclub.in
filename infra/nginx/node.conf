# ==============================================================================
# Local Fabric Node Reverse Proxy (Running on Compute Nodes / Laptops)
# ==============================================================================

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /opt/ccc-node/static;
    index index.html;

    # Local API Worker Cluster
    upstream local_api_workers {
        least_conn;
        server 127.0.0.1:9001;
        server 127.0.0.1:9002;
        server 127.0.0.1:9003;
        server 127.0.0.1:9004;
        keepalive 32;
    }

    # Immutable static assets served locally
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Local API proxy
    location /api/ {
        proxy_pass http://local_api_workers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Node-Local "true";
    }

    # Local fallback for SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
