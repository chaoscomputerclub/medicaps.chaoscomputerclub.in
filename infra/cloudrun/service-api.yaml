apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ccc-api
  labels:
    cloud.googleapis.com/location: asia-south1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 30
      serviceAccountName: ccc-backend-sa@medicaps-production.iam.gserviceaccount.com
      containers:
        - image: gcr.io/medicaps-production/ccc-backend:v1.0.10
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: SERVICE_MODE
              value: "api"
            - name: ENVIRONMENT
              value: "production"
            - name: VERSION
              value: "1.0.10"
            - name: DB_POOL_SIZE
              value: "3"
            - name: DB_MAX_OVERFLOW
              value: "2"
            - name: ALLOW_UNSANDBOXED_EXECUTION
              value: "false"
            - name: PREFER_LOCAL_JUDGE_ENGINE
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ccc-supabase-db-url
                  key: latest
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: ccc-redis-host
                  key: latest
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ccc-redis-password
                  key: latest
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ccc-secret-key
                  key: latest
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: ccc-jwt-private-key
                  key: latest
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: ccc-jwt-public-key
                  key: latest
            - name: JUDGE_AGENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ccc-judge-agent-secret
                  key: latest
