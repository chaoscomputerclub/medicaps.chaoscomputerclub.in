<!DOCTYPE html>
<html lang="en" class="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>CCC Medi-Caps Offline Contest Portal</title>
    <meta name="description" content="Proctored campus contests, verified scoreboards, ratings, and cryptographic result proofs." />
    <meta name="author" content="Chaos Computer Club — Medi-Caps Chapter" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preload" href="/logo.webp" as="image" type="image/webp" />
    <link rel="preload" href="/assets/inter-latin-wght-normal-Dx4kXJAl.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="bg-black text-white antialiased selection:bg-lime-400 selection:text-black min-h-screen">
    <div id="root">
      <div style="min-height:100vh;background:#000000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:#ffffff;user-select:none;">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
          <img src="/logo.webp" alt="CCC" style="width:44px;height:44px;object-fit:contain;border-radius:10px;position:relative;z-index:1;" />
          <div style="position:absolute;inset:-6px;border:1.5px solid rgba(204,255,0,0.4);border-radius:16px;animation:ccc-pulse 1.8s cubic-bezier(0.4,0,0.6,1) infinite;"></div>
        </div>
        <div style="font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:0.18em;color:#CCFF00;margin-bottom:6px;text-transform:uppercase;font-weight:600;">
          Chaos Computer Club
        </div>
        <div style="font-size:11px;color:rgba(255,255,255,0.45);letter-spacing:0.08em;margin-bottom:18px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;">
          Medi-Caps University Chapter
        </div>
        <div style="width:130px;height:2px;background:rgba(255,255,255,0.08);border-radius:9999px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;bottom:0;width:35%;background:#CCFF00;border-radius:9999px;animation:ccc-scan 1.2s cubic-bezier(0.65,0,0.35,1) infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes ccc-pulse { 0%, 100% { opacity: 0.25; transform: scale(0.98); } 50% { opacity: 0.85; transform: scale(1.04); } }
        @keyframes ccc-scan { 0% { left: -35%; width: 25%; } 50% { left: 35%; width: 45%; } 100% { left: 100%; width: 25%; } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
