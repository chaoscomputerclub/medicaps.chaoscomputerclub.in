<!DOCTYPE html>
<html lang="en" class="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>CCC Medi-Caps Offline Contest Portal</title>
    <meta name="description" content="Proctored campus contests, verified scoreboards, ratings, and cryptographic result proofs." />
    <meta name="author" content="Chaos Computer Club — Medi-Caps Chapter" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preload" href="/logo.webp" as="image" type="image/webp" />
    <link rel="preload" href="/assets/inter-latin-wght-normal-Dx4kXJAl.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="bg-black text-white antialiased selection:bg-lime-400 selection:text-black min-h-screen">
    <div id="root">
      <div style="min-height:100vh;background:#000000;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;">
        <span
          role="status"
          aria-label="Loading"
          style="--eye-size:52px;--gap:9px;--eye-bg:rgba(255,255,255,0.16);--pupil-color:#ffffff;position:relative;display:inline-flex;aspect-ratio:9/4;height:52px;align-items:center;justify-content:center;vertical-align:middle;"
        >
          <span
            aria-hidden="true"
            style="display:inline-flex;align-items:center;justify-content:center;gap:var(--gap);"
          >
            <span
              class="wandering-eye-ball"
              style="width:var(--eye-size);height:var(--eye-size);border-radius:9999px;display:inline-block;background-color:var(--eye-bg);background-image:radial-gradient(circle calc(var(--eye-size)*0.32),var(--pupil-color) 100%,transparent 0);background-repeat:no-repeat;animation:loading-ui-wandering-eyes-move 10s infinite,loading-ui-wandering-eyes-blink 10s infinite;"
            ></span>
            <span
              class="wandering-eye-ball"
              style="width:var(--eye-size);height:var(--eye-size);border-radius:9999px;display:inline-block;background-color:var(--eye-bg);background-image:radial-gradient(circle calc(var(--eye-size)*0.32),var(--pupil-color) 100%,transparent 0);background-repeat:no-repeat;animation:loading-ui-wandering-eyes-move 10s infinite,loading-ui-wandering-eyes-blink 10s infinite;"
            ></span>
          </span>
          <span style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border-width:0;">Loading</span>
        </span>
        <p class="text-shimmer">Loading</p>
      </div>
      <style>
        @keyframes loading-ui-wandering-eyes-move {
          0%, 10% { background-position: 0 0; }
          13%, 40% { background-position: calc(var(--eye-size) * 0.3125 * -1) 0; }
          43%, 70% { background-position: calc(var(--eye-size) * 0.3125) 0; }
          73%, 90% { background-position: 0 calc(var(--eye-size) * 0.3125); }
          93%, 100% { background-position: 0 0; }
        }
        @keyframes loading-ui-wandering-eyes-blink {
          0%, 10%, 12%, 20%, 22%, 40%, 42%, 60%, 62%, 70%, 72%, 90%, 92%, 98%, 100% { height: var(--eye-size); }
          11%, 21%, 41%, 61%, 71%, 91%, 99% { height: calc(var(--eye-size) * 0.375); }
        }
        .text-shimmer {
          position: relative;
          display: inline-block;
          background-size: 250% 100%, auto;
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;
          background-repeat: no-repeat, padding-box;
          --spread: 14px;
          --base-color: rgba(255, 255, 255, 0.4);
          --base-gradient-color: #ffffff;
          --bg: linear-gradient(90deg, #0000 calc(50% - var(--spread)), var(--base-gradient-color), #0000 calc(50% + var(--spread)));
          background-image: var(--bg), linear-gradient(var(--base-color), var(--base-color));
          animation: text-shimmer-move 2s linear infinite;
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
          font-size: 11px;
          letter-spacing: 0.25em;
          text-transform: uppercase;
          margin-top: 20px;
          margin-bottom: 0;
        }
        @keyframes text-shimmer-move {
          0% { background-position: 100% center; }
          100% { background-position: 0% center; }
        }
        @media (prefers-reduced-motion: reduce) {
          .wandering-eye-ball, .text-shimmer { animation: none !important; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
