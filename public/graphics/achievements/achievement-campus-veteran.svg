  <!-- Laurel Left -->
  <path d="M22 20c-3 3-4 8-2 13 2 4 6 7 10 9" stroke="#CCFF00" stroke-width="2" stroke-linecap="round"/>
  <circle cx="18" cy="24" r="1.5" fill="#00E5FF"/>
  <circle cx="18" cy="30" r="1.5" fill="#00E5FF"/>
  <circle cx="21" cy="36" r="1.5" fill="#00E5FF"/>
  <!-- Laurel Right -->
  <path d="M42 20c3 3 4 8 2 13-2 4-6 7-10 9" stroke="#CCFF00" stroke-width="2" stroke-linecap="round"/>
  <circle cx="46" cy="24" r="1.5" fill="#00E5FF"/>
  <circle cx="46" cy="30" r="1.5" fill="#00E5FF"/>
  <circle cx="43" cy="36" r="1.5" fill="#00E5FF"/>
  <!-- Central Veteran Star -->
