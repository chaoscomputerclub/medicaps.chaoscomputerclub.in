<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="sd-rim" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="sd-core" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D2405"/>
      <stop offset="100%" stop-color="#120E02"/>
    </linearGradient>
    <filter id="sd-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#EAB308" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer Octagon Frame -->
  <polygon points="20,4 44,4 60,20 60,44 44,60 20,60 4,44 4,20" fill="url(#sd-core)" stroke="url(#sd-rim)" stroke-width="2.5" stroke-linejoin="round" filter="url(#sd-shadow)"/>
  <polygon points="22,9 42,9 55,22 55,42 42,55 22,55 9,42 9,22" fill="#1C1603" stroke="#CA8A04" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  <!-- Stopwatch Ring -->
  <circle cx="32" cy="34" r="14" stroke="#FACC15" stroke-width="2.2"/>
  <path d="M32 16v4M30 16h4" stroke="#FACC15" stroke-width="2" stroke-linecap="round"/>
  <!-- Speed Lightning Bolt slicing across -->
  <polygon points="34,22 24,35 31,35 28,46 40,32 33,32" fill="#CCFF00" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
