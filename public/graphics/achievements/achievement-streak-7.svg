<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="stk-rim" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="stk-core" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#301405"/>
      <stop offset="100%" stop-color="#120601"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="20" y1="14" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="stk-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#F97316" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer Shield Frame -->
  <polygon points="20,4 44,4 60,20 60,44 44,60 20,60 4,44 4,20" fill="url(#stk-core)" stroke="url(#stk-rim)" stroke-width="2.5" stroke-linejoin="round" filter="url(#stk-shadow)"/>
  <polygon points="22,9 42,9 55,22 55,42 42,55 22,55 9,42 9,22" fill="#1C0A02" stroke="#EA580C" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  <!-- Central Fire Flame -->
  <path d="M32 14c2 5 7 8 7 15 0 6.627-5.373 12-12 12s-12-5.373-12-12c0-5 3-10 7-13 0 4 2 6 4 6 2-4 3-7 6-8z" fill="url(#flame-grad)" stroke="#FEF08A" stroke-width="1.2"/>
  <!-- Inner Flame Core -->
  <path d="M32 28c1 2.5 3.5 4 3.5 7.5 0 3.314-2.686 6-6 6s-6-2.686-6-6c0-2.5 1.5-5 3.5-6.5 0 2 1 3 2 3 1-2 1.5-3.5 3-4z" fill="#FEF08A"/>
  <!-- "7" Badge Tag at bottom -->
  <circle cx="46" cy="46" r="8" fill="#18181B" stroke="#FDE047" stroke-width="1.8"/>
  <text x="46" y="50" font-family="monospace" font-size="11" font-weight="bold" fill="#FDE047" text-anchor="middle">7</text>
</svg>
