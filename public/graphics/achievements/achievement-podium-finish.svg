<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="pod-rim" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="pod-core" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D1A04"/>
      <stop offset="100%" stop-color="#120A02"/>
    </linearGradient>
    <filter id="pod-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer Octagon Shield Frame -->
  <polygon points="20,4 44,4 60,20 60,44 44,60 20,60 4,44 4,20" fill="url(#pod-core)" stroke="url(#pod-rim)" stroke-width="2.5" stroke-linejoin="round" filter="url(#pod-shadow)"/>
  <polygon points="22,9 42,9 55,22 55,42 42,55 22,55 9,42 9,22" fill="#1C1003" stroke="#D97706" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  <!-- Gold Championship Trophy -->
  <path d="M22 16h20v9c0 5.523-4.477 10-10 10s-10-4.477-10-10v-9z" fill="#F59E0B" stroke="#FEF08A" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Trophy Handles -->
  <path d="M22 19h-4c-1.657 0-3 1.343-3 3v2c0 2.761 2.239 5 5 5h2" stroke="#FDE047" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M42 19h4c1.657 0 3 1.343 3 3v2c0 2.761-2.239 5-5 5h-2" stroke="#FDE047" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Trophy Stem & Base -->
  <path d="M32 35v7" stroke="#FEF08A" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="23" y="42" width="18" height="4" rx="1.5" fill="#27272A" stroke="#FEF08A" stroke-width="1.5"/>
  <!-- Star on Cup -->
  <polygon points="32,20 33.5,23.5 37,24 34.5,26.5 35,30 32,28 29,30 29.5,26.5 27,24 30.5,23.5" fill="#CCFF00"/>
  <!-- Laurel sprig dots -->
  <circle cx="16" cy="14" r="1.5" fill="#FEF08A"/>
  <circle cx="48" cy="14" r="1.5" fill="#FEF08A"/>
</svg>
