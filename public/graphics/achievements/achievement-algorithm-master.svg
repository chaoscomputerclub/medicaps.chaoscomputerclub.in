<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="am-rim" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="40%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <linearGradient id="am-core" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#241038"/>
      <stop offset="100%" stop-color="#0E0418"/>
    </linearGradient>
    <filter id="am-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#9333EA" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer Octagon Frame -->
  <polygon points="20,4 44,4 60,20 60,44 44,60 20,60 4,44 4,20" fill="url(#am-core)" stroke="url(#am-rim)" stroke-width="2.5" stroke-linejoin="round" filter="url(#am-shadow)"/>
  <polygon points="22,9 42,9 55,22 55,42 42,55 22,55 9,42 9,22" fill="#170A24" stroke="#7E22CE" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  <!-- Central Crystal Octagon -->
  <polygon points="32,15 44,23 44,41 32,49 20,41 20,23" fill="#6B21A8" stroke="#C084FC" stroke-width="2" stroke-linejoin="round"/>
  <!-- Inner Shard Facets -->
  <polygon points="32,15 44,23 32,32 20,23" fill="#A855F7" fill-opacity="0.6"/>
  <polygon points="20,23 32,32 32,49 20,41" fill="#7E22CE" fill-opacity="0.8"/>
  <polygon points="44,23 44,41 32,49 32,32" fill="#581C87" fill-opacity="0.8"/>
  <!-- Specular Shimmer Core -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF"/>
</svg>
