<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="mg-ribbon" x1="8" y1="2" x2="24" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </linearGradient>
    <linearGradient id="mg-medal" x1="8" y1="10" x2="24" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="mg-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#B45309" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- V Ribbon -->
  <path d="M10 2l6 10-2 2-7-10h3z" fill="url(#mg-ribbon)"/>
  <path d="M22 2l-6 10 2 2 7-10h-3z" fill="url(#mg-ribbon)"/>
  <!-- Medal Outer Coin -->
  <circle cx="16" cy="19" r="10" fill="url(#mg-medal)" stroke="#FEF08A" stroke-width="1.5" filter="url(#mg-shadow)"/>
  <!-- Medal Inner Inset Rim -->
  <circle cx="16" cy="19" r="8" fill="#D97706" stroke="#FEF08A" stroke-width="0.8" stroke-dasharray="1.5 1"/>
  <!-- Rank #1 / Laurel Star -->
  <path d="M16 13.5l1.3 2.7 3 .4-2.2 2.1.5 3-2.6-1.4-2.6 1.4.5-3-2.2-2.1 3-.4z" fill="#FEF08A"/>
