<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="lr-gem" x1="10" y1="6" x2="38" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE4E6"/>
      <stop offset="30%" stop-color="#FB7185"/>
      <stop offset="70%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="lr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#E11D48" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Ruby Octagon / Shield -->
  <polygon points="16,8 32,8 40,16 40,32 32,40 16,40 8,32 8,16" fill="url(#lr-gem)" stroke="#FDA4AF" stroke-width="2" stroke-linejoin="round" filter="url(#lr-glow)"/>
  <!-- Inner Facets -->
  <polygon points="20,14 28,14 34,20 34,28 28,34 20,34 14,28 14,20" fill="#BE123C" stroke="#FECDD3" stroke-width="1.2"/>
  <!-- Center Shard -->
  <polygon points="24,18 30,24 24,30 18,24" fill="#FFE4E6" fill-opacity="0.5"/>
  <!-- Specular Sparkle -->
  <circle cx="22" cy="18" r="1.8" fill="#FFFFFF"/>
</svg>
