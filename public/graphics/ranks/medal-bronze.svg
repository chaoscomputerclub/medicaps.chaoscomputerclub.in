  <!-- Medal Inner Inset Rim -->
  <circle cx="16" cy="19" r="8" fill="#9A3412" stroke="#FED7AA" stroke-width="0.8" stroke-dasharray="1.5 1"/>
  <!-- Rank #3 / Star -->
  <path d="M16 13.5l1.3 2.7 3 .4-2.2 2.1.5 3-2.6-1.4-2.6 1.4.5-3-2.2-2.1 3-.4z" fill="#FED7AA"/>
