<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="mb-ribbon" x1="8" y1="2" x2="24" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="mb-medal" x1="8" y1="10" x2="24" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="40%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <filter id="mb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#7C2D12" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- V Ribbon -->
  <path d="M10 2l6 10-2 2-7-10h3z" fill="url(#mb-ribbon)"/>
  <path d="M22 2l-6 10 2 2 7-10h-3z" fill="url(#mb-ribbon)"/>
