<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="ld-gem" x1="10" y1="6" x2="38" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="ld-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#38BDF8" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Diamond Gem Facets -->
  <polygon points="14,12 34,12 42,21 24,42 6,21" fill="url(#ld-gem)" stroke="#BAE6FD" stroke-width="2" stroke-linejoin="round" filter="url(#ld-glow)"/>
  <!-- Top Table -->
  <polygon points="18,12 30,12 33,21 15,21" fill="#E0F2FE" fill-opacity="0.6"/>
  <!-- Front Triangle -->
  <polygon points="15,21 33,21 24,42" fill="#0284C7" fill-opacity="0.5"/>
  <!-- Left Facet -->
  <polygon points="6,21 15,21 24,42" fill="#0369A1" fill-opacity="0.7"/>
  <!-- Right Facet -->
  <polygon points="42,21 33,21 24,42" fill="#075985" fill-opacity="0.7"/>
  <!-- Specular Sparkle -->
  <circle cx="21" cy="16" r="2" fill="#FFFFFF"/>
</svg>
