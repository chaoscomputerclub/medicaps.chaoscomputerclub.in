<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" width="180" height="140" fill="none">
  <defs>
    <linearGradient id="sec-grid" x1="0" y1="0" x2="180" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#242428"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="sec-lime" x1="40" y1="20" x2="140" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
    <filter id="sec-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#CCFF00" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background Grid Plaque -->
  <rect x="25" y="15" width="130" height="110" rx="16" fill="url(#sec-grid)" stroke="#27272A" stroke-width="1.5"/>
  <!-- Tactical Radar Rings -->
  <circle cx="90" cy="65" r="42" stroke="#27272A" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="90" cy="65" r="30" stroke="#3F3F46" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="90" cy="65" r="18" stroke="#3F3F46" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Radar Crosshairs -->
  <path d="M48 65h84M90 23v84" stroke="#27272A" stroke-width="1"/>
  <!-- Sweep Scan Cone -->
  <path d="M90 65L120 35A42 42 0 0 1 132 65Z" fill="#CCFF00" fill-opacity="0.08"/>
  <path d="M90 65l30-30" stroke="#CCFF00" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Central Calendar / Trophy Beacon -->
  <rect x="75" y="50" width="30" height="30" rx="6" fill="#18181B" stroke="url(#sec-lime)" stroke-width="2" filter="url(#sec-glow)"/>
  <path d="M83 60h14M83 66h9" stroke="#CCFF00" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="83" cy="72" r="1.5" fill="#CCFF00"/>
  <!-- Beacon Blip Dots -->
  <circle cx="120" cy="45" r="2.5" fill="#CCFF00"/>
  <circle cx="65" cy="80" r="1.8" fill="#71717A"/>
</svg>
