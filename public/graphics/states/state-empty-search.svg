<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" width="180" height="140" fill="none">
  <defs>
    <linearGradient id="ser-grid" x1="0" y1="0" x2="180" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#242428"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="ser-lime" x1="60" y1="30" x2="120" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
    <filter id="ser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#CCFF00" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="25" y="15" width="130" height="110" rx="16" fill="url(#ser-grid)" stroke="#27272A" stroke-width="1.5"/>
  <!-- Magnifying Lens Ring -->
  <circle cx="82" cy="62" r="26" fill="#18181B" stroke="url(#ser-lime)" stroke-width="2.5" filter="url(#ser-glow)"/>
  <!-- Lens Inner Circle -->
  <circle cx="82" cy="62" r="21" fill="#1A2610" stroke="#3F3F46" stroke-width="1"/>
  <!-- Lens Specular Curve -->
  <path d="M68 52a16 16 0 0 1 20-4" stroke="#CCFF00" stroke-width="2" stroke-linecap="round"/>
  <!-- Lens Handle -->
  <path d="M101 81l22 22" stroke="url(#ser-lime)" stroke-width="5" stroke-linecap="round"/>
  <!-- Empty Question Crosshair inside Lens -->
  <path d="M78 57a4 4 0 0 1 7.5 2c0 2-3.5 2.5-3.5 4.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="82" cy="68" r="1.4" fill="#FFFFFF"/>
</svg>
