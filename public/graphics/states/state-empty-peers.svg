<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" width="180" height="140" fill="none">
  <defs>
    <linearGradient id="sep-grid" x1="0" y1="0" x2="180" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#242428"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="sep-lime" x1="50" y1="30" x2="130" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
    <filter id="sep-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#CCFF00" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="25" y="15" width="130" height="110" rx="16" fill="url(#sep-grid)" stroke="#27272A" stroke-width="1.5"/>
  <!-- Constellation Nodes Network -->
  <!-- Center Node (You) -->
  <circle cx="90" cy="65" r="14" fill="#18181B" stroke="url(#sep-lime)" stroke-width="2.2" filter="url(#sep-glow)"/>
  <circle cx="90" cy="61" r="4.5" fill="#CCFF00"/>
  <path d="M81 74c0-4 4-6 9-6s9 2 9 6" stroke="#CCFF00" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Orbit Node 1 (Top Left) -->
  <line x1="90" y1="65" x2="56" y2="42" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="56" cy="42" r="7" fill="#18181B" stroke="#71717A" stroke-width="1.5"/>
  <circle cx="56" cy="42" r="2.5" fill="#71717A"/>
  <!-- Orbit Node 2 (Top Right) -->
  <line x1="90" y1="65" x2="124" y2="42" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="124" cy="42" r="7" fill="#18181B" stroke="#71717A" stroke-width="1.5"/>
  <circle cx="124" cy="42" r="2.5" fill="#71717A"/>
  <!-- Orbit Node 3 (Bottom Center) -->
  <line x1="90" y1="65" x2="90" y2="98" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="90" cy="98" r="6" fill="#18181B" stroke="#71717A" stroke-width="1.5"/>
  <circle cx="90" cy="98" r="2" fill="#71717A"/>
</svg>
