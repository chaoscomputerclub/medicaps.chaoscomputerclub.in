<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="rc-rim" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="50%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#4D7C0F"/>
    </linearGradient>
    <linearGradient id="rc-core" x1="8" y1="8" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#243314"/>
      <stop offset="100%" stop-color="#0E1606"/>
    </linearGradient>
    <filter id="rc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#CCFF00" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Outer Gold/Lime Coin Bezel -->
  <circle cx="20" cy="20" r="17" fill="url(#rc-core)" stroke="url(#rc-rim)" stroke-width="2.5" filter="url(#rc-glow)"/>
  <!-- Inner Circuit Ring -->
  <circle cx="20" cy="20" r="13" stroke="#4D7C0F" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  <!-- Central CCC Monogram -->
  <path d="M25 15.5c-1-1-2.5-1.5-4.5-1.5-3.5 0-6 2.5-6 6s2.5 6 6 6c2 0 3.5-.5 4.5-1.5" stroke="#CCFF00" stroke-width="2.5" stroke-linecap="round"/>
</svg>
