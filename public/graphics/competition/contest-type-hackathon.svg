<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="ch-bg" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D1838"/>
      <stop offset="100%" stop-color="#14061A"/>
    </linearGradient>
    <linearGradient id="ch-cyan" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <!-- Hexagonal Tech Pad -->
  <polygon points="24,3 43,14 43,34 24,45 5,34 5,14" fill="url(#ch-bg)" stroke="url(#ch-cyan)" stroke-width="2" stroke-linejoin="round"/>
  <!-- Central Hackathon Lightning + Flag -->
  <polygon points="25,12 17,24 23,24 21,34 31,21 25,21" fill="#00E5FF" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Bottom Ticker -->
  <text x="24" y="40" font-family="monospace" font-size="6.5" font-weight="bold" fill="#00E5FF" text-anchor="middle" letter-spacing="1">HACKATHON</text>
</svg>
