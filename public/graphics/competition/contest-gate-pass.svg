<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="gp-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- Pass Badge Ticket Silhouette -->
  <rect x="8" y="6" width="32" height="36" rx="4" fill="#18181B" stroke="url(#gp-grad)" stroke-width="2"/>
  <!-- Cutout Notches on Sides -->
  <circle cx="8" cy="24" r="3" fill="#171717" stroke="url(#gp-grad)" stroke-width="1.5"/>
  <circle cx="40" cy="24" r="3" fill="#171717" stroke="url(#gp-grad)" stroke-width="1.5"/>
  <!-- Top QR Grid Scanner -->
  <rect x="15" y="11" width="6" height="6" rx="1" fill="#CCFF00"/>
  <rect x="27" y="11" width="6" height="6" rx="1" fill="#CCFF00"/>
  <rect x="15" y="27" width="6" height="6" rx="1" fill="#CCFF00"/>
  <rect x="27" y="27" width="3" height="3" fill="#CCFF00"/>
  <rect x="30" y="30" width="3" height="3" fill="#CCFF00"/>
  <!-- Center Scan Bar Line -->
  <path d="M13 21h22" stroke="#00E5FF" stroke-width="1.8" stroke-dasharray="2 1.5"/>
  <!-- Pass Footer -->
  <path d="M14 37h20" stroke="#71717A" stroke-width="1.5" stroke-linecap="round"/>
</svg>
